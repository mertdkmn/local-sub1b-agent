<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mini Shop — Login</title>
</head>
<body>
  <nav>
    <a id="nav-home" href="index.html">Home</a>
    <a id="nav-about" href="about.html">About</a>
    <a id="nav-products" href="products.html">Products</a>
    <a id="nav-login" href="login.html">Login</a>
  </nav>

  <h1>Login</h1>

  <form id="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password">
    <button type="submit" id="login-btn">Login</button>
  </form>

  <div id="login-success" hidden>Welcome back!</div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value.trim();
      if (u !== '' && p !== '') {
        document.getElementById('login-success').hidden = false;
      }
    });
  </script>
</body>
</html>
